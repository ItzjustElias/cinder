license = "${mod_license}"
issueTrackerURL = "${mod_sources_url}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_sources_url}"
authors = "${mod_author}"
description = '''${mod_description}'''
iconFile = "assets/${mod_id}/icon.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_minecraft_range}"
ordering = "NONE"
side = "CLIENT"
