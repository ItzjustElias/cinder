plugins {
	id 'java-library'
	id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/conventions.gradle')

base {
	archivesName = "${project.mod_id}-neoforge"
}

configurations {
	commonJava { canBeResolved = true }
	commonResources { canBeResolved = true }
}

dependencies {
	compileOnly project(':common')
	commonJava project(path: ':common', configuration: 'commonJava')
	commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
	dependsOn configurations.commonJava
	source configurations.commonJava
}

tasks.named('processResources', ProcessResources) {
	dependsOn configurations.commonResources
	from configurations.commonResources
}

tasks.named('sourcesJar', Jar) {
	dependsOn configurations.commonJava, configurations.commonResources
	from configurations.commonJava
	from configurations.commonResources
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	compileOnly "org.spongepowered:mixin:${project.mixin_version}"

	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-neoforge"
}

tasks.named('processResources', ProcessResources) {
	dependsOn configurations.commonResources
	from configurations.commonResources

	def props = [
			"mod_id"                  : project.mod_id,
			"mod_name"                : project.mod_name,
			"mod_version"             : project.mod_version,
			"mod_author"              : project.mod_author,
			"mod_license"             : project.mod_license,
			"mod_description"         : project.mod_description,
			"mod_sources_url"         : project.mod_sources_url,
			"neoforge_version"        : project.neoforge_version,
			"neoforge_minecraft_range": project.neoforge_minecraft_range
	]

	inputs.properties props
	filesMatching('META-INF/neoforge.mods.toml') {
		expand props
	}
}
