name: Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format, test, build both loaders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Check formatting, run tests, build Fabric and NeoForge
        run: ./gradlew buildAll collectJars --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: Cinder-jars
          path: build/dist/*.jar
          retention-days: 14

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: common/build/reports/tests/
          retention-days: 7
