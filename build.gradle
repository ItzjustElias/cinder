plugins {
	id 'com.diffplug.spotless'
}

repositories {
	mavenCentral()
}

spotless {
	java {
		target 'common/src/**/*.java', 'fabric/src/**/*.java', 'neoforge/src/**/*.java'
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.register('buildAll') {
	group = 'build'
	description = 'Checks formatting, runs the tests and builds the Fabric and NeoForge jars.'
	dependsOn 'spotlessCheck', ':common:test', ':fabric:build', ':neoforge:build'
}

tasks.register('collectJars', Copy) {
	group = 'build'
	description = 'Copies the release jars of every loader into build/dist.'
	dependsOn ':fabric:build', ':neoforge:build'
	from(project(':fabric').tasks.named('jar'))
	from(project(':neoforge').tasks.named('jar'))
	into layout.buildDirectory.dir('dist')
}
